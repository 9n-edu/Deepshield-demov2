<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增員工帳戶</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="email"], select {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>員工註冊與加密證件上傳</h2>
    
    <!-- 表單不使用預設的 submit，而是交由 JavaScript 攔截處理 -->
    <form id="registerForm">
        <div class="form-group">
            <label for="email">帳號 (Email)</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="gender">性別</label>
            <select id="gender" name="gender" required>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-group">
            <label for="department">部門</label>
            <select id="department" name="department" required>
                <option value="研發部">研發部</option>
                <option value="業務部">業務部</option>
                <option value="人資部">人資部</option>
            </select>
        </div>

        <div class="form-group">
            <label for="position">職位</label>
            <select id="position" name="position" required>
                <option value="一般員工">一般員工</option>
                <option value="主管">主管</option>
            </select>
        </div>

        <div class="form-group">
            <label for="photo">上傳照片</label>
            <input type="file" id="photo" name="photo" accept="image/png, image/jpeg" required>
        </div>

        <button type="submit">送出</button>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // 阻止表單重新整理頁面

            // 將表單資料打包成 FormData 格式（包含圖片檔案）
            const formData = new FormData(this);

            try {
                // 發送 POST 請求給 Python FastAPI 後端
                const response = await fetch('http://127.0.0.1:8000/api/add_account', {
                method: 'POST',
                body: formData
            });

                const result = await response.json();

                if (response.ok) {
                    // 提示使用者建立成功，並顯示剛產生的員工編號
                    alert(`帳戶建立成功！您的員工編號為：${result.emp_id}`);
                    
                    // 將新建立的員工編號存入瀏覽器，模擬登入狀態
                    localStorage.setItem('loggedInEmpId', result.emp_id);
                    
                    // 自動跳轉至個人資料頁面 (若你的檔案名稱不同，請將 profile.html 改為對應名稱，如 profile_3.html)
                    window.location.href = "profile.html"; 
                } else {
                    alert('發生錯誤：' + (result.detail || '未知錯誤'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('無法連線至伺服器，請確認後端已啟動。');
            }
        });
    </script>
</body>
</html>
